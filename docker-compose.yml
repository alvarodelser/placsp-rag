# PLACSP backend deployment: Weaviate + Search API.
# The UI is a static build served by the host nginx — see search-ui/README.md.
#
# Quick start:
#   cp .env.example .env   # edit: set WEAVIATE_API_KEY and NEO4J_PASSWORD
#   docker compose up -d
#   # brings up Weaviate + Neo4j (company graph) + search-api; the one-shot
#   # init-schema / init-graph services create the schema and graph constraints.
#
# Vectorizer note:
#   The BGE-M3 vectorizer is a pre-existing container (iarag project). It publishes its port on
#   the host's loopback only, so containers reach it by name on its own network: the search-api
#   joins that network (VECTORIZER_NETWORK, default n8n-net) and calls
#   SEARCH_VECTORIZER_URL (default http://vectorizer:8089). VECTORIZER_URL in .env is for
#   processes on the host (ingester, pilot): http://localhost:8089.
#   Find the network: docker inspect vectorizer --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'

services:

  # ── Weaviate (vector store) ───────────────────────────────────────────────
  placsp-weaviate:
    image: semitechnologies/weaviate:1.28.3
    container_name: placsp-weaviate
    restart: unless-stopped
    command:
      - --host=0.0.0.0
      - --port=8080
      - --scheme=http
    ports:
      - "${WEAVIATE_HTTP_PORT:-8087}:8080"
      - "${WEAVIATE_GRPC_PORT:-50052}:50051"
    volumes:
      - placsp_weaviate_data:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: "25"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "placsp1"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "${WEAVIATE_API_KEY}"
      AUTHENTICATION_APIKEY_USERS: "placsp-ingest"
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: "placsp-ingest"
      LIMIT_RESOURCES: "true"
      GOMEMLIMIT: "${WEAVIATE_GOMEMLIMIT:-4GiB}"
    # No container healthcheck: the Weaviate image ships no wget/curl, so a wget-based
    # healthcheck would never report "healthy" and would deadlock dependents. Readiness
    # is instead gated by placsp-init-schema, which polls /v1/.well-known/ready below.

  # ── Neo4j (company graph) ─────────────────────────────────────────────────
  placsp-neo4j:
    image: neo4j:5
    container_name: placsp-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-2G}"
    volumes:
      - placsp_neo4j_data:/data

  # ── Qdrant (vector store; the pilot's collections live here) ──────────────
  # Replaces Weaviate as the vector store. Collections are created by their
  # owner (`python -m placsp_pilot index` for the pilot_* ones), never implicitly.
  placsp-qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: placsp-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6343}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6344}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT: "false"
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - placsp_qdrant_data:/qdrant/storage
    # RocksDB keeps files open per segment; Docker's default soft limit of 1024
    # makes Qdrant stop accepting connections on a large corpus.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ── Schema init (one-shot, idempotent) ───────────────────────────────────
  placsp-init-schema:
    build:
      context: .
      dockerfile: deploy/ingester/Dockerfile
    image: placsp-ingester
    container_name: placsp-init-schema
    environment:
      WEAVIATE_URL: "http://placsp-weaviate:8080"
      WEAVIATE_API_KEY: "${WEAVIATE_API_KEY}"
    command:
      - sh
      - -c
      - |
        until python -c "import urllib.request; urllib.request.urlopen('http://placsp-weaviate:8080/v1/.well-known/ready')" 2>/dev/null; do
          sleep 2
        done
        python -m placsp init-schema
    depends_on:
      placsp-weaviate:
        condition: service_started
    restart: "no"

  # ── Graph init (one-shot, idempotent) ─────────────────────────────────────
  placsp-init-graph:
    image: placsp-ingester
    container_name: placsp-init-graph
    environment:
      NEO4J_URL: "bolt://placsp-neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
    command:
      - sh
      - -c
      - |
        until python -c "from neo4j import GraphDatabase; GraphDatabase.driver('bolt://placsp-neo4j:7687', auth=('neo4j','${NEO4J_PASSWORD}')).verify_connectivity()" 2>/dev/null; do
          sleep 2
        done
        python -m placsp init-graph
    depends_on:
      placsp-neo4j:
        condition: service_started
      placsp-init-schema:
        condition: service_completed_successfully
    restart: "no"

  # ── Search API (FastAPI / uvicorn) ────────────────────────────────────────
  placsp-search-api:
    build:
      context: ./search-api
      args:
        # Baked into the image as ENV APP_VERSION; `make deploy` sets it to the
        # git commit. Defaults to "unknown" if built without it.
        APP_VERSION: "${APP_VERSION:-unknown}"
    image: placsp-search-api
    container_name: placsp-search-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARCH_API_PORT:-8092}:8092"
    environment:
      WEAVIATE_URL: "http://placsp-weaviate:8080"
      WEAVIATE_API_KEY: "${WEAVIATE_API_KEY}"
      VECTORIZER_URL: "${SEARCH_VECTORIZER_URL:-http://vectorizer:8089}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      USERS_DB: "/data/users.db"
      SECRET_KEY: "${SECRET_KEY}"
      NEO4J_URL: "bolt://placsp-neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      # Document pilot viewer (/api/pilot): its Qdrant collections. Originals are shown from PLACSP.
      PILOT_QDRANT_URL: "http://placsp-qdrant:6333"
      PILOT_QDRANT_API_KEY: "${QDRANT_API_KEY}"
      # Questions over the pilot's documents (search-api/pilot_rag.py): the reranker below, and the
      # Ollama that writes the answers. Empty values switch that step off, and the viewer says so.
      RERANKER_URL: "${RERANKER_URL:-http://placsp-reranker:80}"
      ANSWER_OLLAMA_URL: "${ANSWER_OLLAMA_URL:-}"
      ANSWER_MODEL: "${ANSWER_MODEL:-gemma4:e4b}"
      ANSWER_KEEP_ALIVE: "${ANSWER_KEEP_ALIVE:-30m}"
      # APP_VERSION is baked into the image at build time (build.args above), not
      # set here — a runtime default would override the baked commit with "unknown".
    volumes:
      - placsp_feedback_data:/data
    networks: [default, vectorizer]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      placsp-init-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8092/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s


  # Reranker for the pilot's questions: Hugging Face text-embeddings-inference serving the
  # cross-encoder BAAI/bge-reranker-v2-m3 (POST /rerank). No code of ours. CPU by default; for a
  # GPU, RERANKER_IMAGE=ghcr.io/huggingface/text-embeddings-inference:89-1.8 (L40) and a device
  # reservation. The model (~2.3 GB) is downloaded on first start into placsp_reranker_data.
  placsp-reranker:
    image: "${RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}"
    container_name: placsp-reranker
    restart: unless-stopped
    command: ["--model-id", "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}", "--max-client-batch-size", "64"]
    ports:
      - "127.0.0.1:${RERANKER_PORT:-8095}:80"
    volumes:
      - placsp_reranker_data:/data

volumes:
  placsp_weaviate_data:
    name: placsp_weaviate_data   # compose-managed, stable name; persists across down/up
                                 # (removed only by an explicit `docker compose down -v`)
  placsp_feedback_data:
    name: placsp_feedback_data   # users.db (accounts, invite list, saved items); the name is historical — keep it
  placsp_neo4j_data:
    name: placsp_neo4j_data      # company graph; same persistence semantics
  placsp_reranker_data:
    name: placsp_reranker_data   # the reranker's downloaded model
  placsp_qdrant_data:
    name: placsp_qdrant_data     # vector store; same persistence semantics

networks:
  # The vectorizer's own network (see the note at the top); it must exist before `up`.
  vectorizer:
    external: true
    name: ${VECTORIZER_NETWORK:-n8n-net}
