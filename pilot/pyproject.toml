[project]
name = "placsp-pilot"
version = "0.1.0"
description = "Isolated pilot: full document processing of N PLACSP expedientes with timing and volume metrics"
requires-python = ">=3.11"
dependencies = ["lxml>=5", "httpx>=0.27", "beautifulsoup4>=4.12", "PyMuPDF>=1.24", "openpyxl>=3.1", "PyYAML>=6", "qdrant-client>=1.12,<1.13", "neo4j>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
placsp-pilot = "placsp_pilot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["placsp_pilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
